plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'eu.kanade.tachiyomi.extension.ko.arcgrid'
    compileSdk 34
    defaultConfig {
        applicationId 'eu.kanade.tachiyomi.extension.ko.arcgrid'
        minSdk 21
        targetSdk 28
        versionCode 4
        versionName '1.4.4'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    dependenciesInfo { includeInApk false }
}
dependencies {
    compileOnly project(':api')
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'io.reactivex:rxjava:1.3.8'
    compileOnly 'org.jsoup:jsoup:1.18.3'
}
android {
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}
